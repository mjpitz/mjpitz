gitea:
  image:
    repository: gitea/gitea
    tag: 1.26.2

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: code.mya.sh
      # Disable Cloudflare proxy so SSH (port 22) traffic reaches the cluster directly.
      # HTTPS still works — cert-manager handles TLS at the cluster level.
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
      # SSL redirect is already handled globally by Traefik's web→websecure entrypoint redirect.
      # Middleware order: countryblock → rate-limit → cors → buffering
      traefik.ingress.kubernetes.io/router.middlewares: code-countryblock@kubernetescrd,code-rate-limit@kubernetescrd,code-cors@kubernetescrd,code-buffering@kubernetescrd
    hosts:
      - host: code.mya.sh
    tls:
      - secretName: gitea-tls
        hosts:
          - code.mya.sh

  # Set fsGroup so Kubernetes chowns the Longhorn PVC mount points to group
  # 1000 (git) on startup, allowing the container (runAsUser: 1000) to write.
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

  podSecurityContext:
    fsGroup: 1000

  persistence:
    # Main gitea data directory (SQLite db, config, indexes)
    storageClass: longhorn
    resources:
      storage: 10Gi
    # Git repositories
    git:
      storageClass: longhorn
      resources:
        storage: 20Gi
    # Blobs are stored in S3 -- disable the PVC.
    blobs:
      enabled: false

  config:
    actions:
      enabled: true
    
    email:
      host: ""
      port: 465
      from: ""
      username: ""
      password: ""

    repository:
      overrides:
        DISABLE_STARS: true
        DEFAULT_BRANCH: main

    ui:
      overrides:
        DEFAULT_THEME: gitea-dark
        USE_SERVICE_WORKER: true

    service:
      overrides:
        DISABLE_REGISTRATION: true

      explore:
        overrides:
          DISABLE_USERS_PAGE: false

    security:
      installLock: true
      # secretKey and internalToken are injected via helmfile set

    server:
      overrides:
        ROOT_URL: "https://code.mya.sh"
        HTTP_PORT: "8080"
        SSH_DOMAIN: "code.mya.sh"
        SSH_PORT: "22"
        START_SSH_SERVER: "true"

    blobs:
      endpoint: nyc3.digitaloceanspaces.com
      bucket: mya-gitea
      region: nyc3
      useSSL: true

  # -- Use Redis-backed queues.
  redis-queue:
    enabled: true

    image:
      repository: docker.io/library/redis

    persistence:
      enabled: true
      storageClass: longhorn

    metrics:
      serviceMonitor:
        enabled: false

  # -- Cache data in redis.
  redis:
    enabled: true

    image:
      repository: docker.io/library/redis

    metrics:
      serviceMonitor:
        enabled: false
