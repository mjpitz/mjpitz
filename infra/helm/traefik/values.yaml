traefik:
  # Configure the Traefik deployment
  deployment:
    kind: Deployment
    replicas: 2

  # Entrypoints configuration
  ports:
    web:
      port: 8000
      hostPort: 80
      protocol: TCP
      # Redirect HTTP to HTTPS
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      port: 8443
      hostPort: 443
      protocol: TCP
      # TLS is managed at the router level by cert-manager, not at the entrypoint.
    # SSH TCP entrypoint for Gitea. Traefik listens on 2222 internally
    # and the LoadBalancer exposes it as port 22 externally.
    ssh:
      port: 2222
      exposedPort: 22
      protocol: TCP
      expose:
        default: true

  # Service configuration
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    # Preserve real client IPs from Cloudflare
    spec:
      loadBalancerSourceRanges: []

  # IngressClass configuration
  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik

  # Providers
  providers:
    kubernetesCRD:
      enabled: true
      # Allow cross-namespace references for IngressRoutes
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true
      # Use the traefik IngressClass
      ingressClass: traefik
      allowExternalNameServices: true

  # Disable Traefik's built-in ACME
  # cert-manager handles certificate issuance instead
  certificatesResolvers: {}

  # Plugins
  experimental:
    plugins:
      countryblock:
        moduleName: "github.com/dkhalife/traefik-country-block"
        version: "v0.2.3"

  # Metrics (optional, disabled by default)
  metrics:
    prometheus:
      enabled: false

  # Disable dashboard by default
  api:
    dashboard: false
    debug: false

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 100Mi

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
